# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: 'd7ef7790-a2e5-4fd5-b021-bdf14a2f1342'
  imageRepository: 'hakimmyazdeployment'
  containerRegistry: 'myregistry12345.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)


    - task: AzureCLI@2
      displayName: Deploy to Azure Container Instances
      inputs:
        azureSubscription: 'Azure-Cloud-Link'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az container create \
            --resource-group VisualStudioOnline-DBEDE2304E4945868A7D98F0F6BD3E02 \
            --name my-live-container \
            --image $(containerRegistry)/$(imageRepository):$(tag) \
            --registry-login-server $(containerRegistry) \
            --registry-username myregistry12345 \
            --registry-password 72V6z0ZGjRmSEPlCTqk4JyvrW81MjSTumrZXxOtVC55IMTj3evRmJQQJ99CJAC1i4TkEqg7NAAACAZCRABnB \
            --dns-name-label hakim-demo-site \
            --ports 80 \
            --os-type Linux